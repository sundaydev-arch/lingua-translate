name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Package VSIX
        run: npm run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: 'release/*.vsix'
          generate_release_notes: true

      # Publish to the VS Code Marketplace automatically once VSCE_PAT is configured
      - name: Publish to Marketplace
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --no-dependencies -p "$VSCE_PAT"

      # Publish to Open VSX automatically once OVSX_PAT is configured (used by Cursor / Windsurf, etc.)
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish release/*.vsix -p "$OVSX_PAT"
